<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="form-container" style="text-align: center;">
    <h1>👤 Student Profile</h1>

    <div style="margin-bottom: 20px;">
        {% if student.photo %}
            <img src="/{{ student.photo }}" alt="Photo" width="120" height="120" style="object-fit: cover; border-radius: 50%; border: 3px solid #007bff;">
        {% else %}
            <div style="width: 120px; height: 120px; border-radius: 50%; background: #ccc; display: inline-block; line-height: 120px; color: #555;">No Photo</div>
        {% endif %}
    </div>

    <table style="text-align: left; width: 100%; margin-bottom: 20px;">
        <tr><th>ID:</th> <td>{{ student.id }}</td></tr>
        <tr><th>Name:</th> <td>{{ student.name }}</td></tr>
        <tr><th>Age:</th> <td>{{ student.age }}</td></tr>
        <tr><th>Gender:</th> <td>{{ student.gender }}</td></tr>
        <tr><th>Course:</th> <td>{{ student.course }}</td></tr>
        <tr><th>Email:</th> <td>{{ student.email }}</td></tr>
    </table>

    <a href="/" class="back-btn" style="display: inline-block; text-align: center;">Back to List</a>
</div>

</body>
</html>
