<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container" style="max-width: 400px; margin: 50px auto;">
    <h2>🔑 Change Password</h2>
    
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/change-password" method="post">
        <div style="margin-bottom: 15px;">
            <label>Current Password:</label><br>
            <input type="password" name="old_password" required style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>New Password:</label><br>
            <input type="password" name="new_password" required style="width: 100%; padding: 8px;">
        </div>

        <button type="submit" style="background-color: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%;">
            Update Password
        </button>
    </form>
    
    <br>
    <a href="/">← Back to Dashboard</a>
</div>
</body>
</html>
